aid: kreditbee
name: KreditBee
description: 'KreditBee is a Bengaluru, India digital lending platform founded in 2017
  by Madhusudan Ekambaram, Vivek Veda and Karthikeyan Krishnaswamy, operated by Finnovation
  Tech Solutions Private Limited (CIN U74900KA2016PTC086953) and lending through its
  in-house RBI-registered NBFC KrazyBee Services Limited alongside partner banks and
  NBFCs. Its consumer products are instant personal loans from Rs 6,000 to Rs 10 lakh,
  business loans up to Rs 1 crore, two-wheeler loans up to Rs 5 lakh, loan against property,
  a flexi personal loan line, 24K digital gold, and free credit score reports, delivered
  through an Android and iOS app and a single-page web application that the company
  says serves over 7 crore registered Indian users. KreditBee publishes no public developer
  portal, no API documentation, no API reference, no SDKs and no machine-readable API
  description of any kind. Its only API host, api.kreditbee.in, is an AWS API Gateway
  behind Cloudflare that answers HTTP 403 ForbiddenException to every anonymous request
  and exists to serve the company''s own mobile and web clients. Partner and lending-partner
  integrations are transacted through the /partner-with-us and /digital-lending-partners
  business pages rather than through any self-serve technical surface.'
