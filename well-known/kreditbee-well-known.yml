summary: >-
  KreditBee publishes no /.well-known document of any kind. Every KreditBee web host is
  a client-rendered single-page application whose origin answers HTTP 200 with the same
  HTML shell for every unmatched path — including /.well-known/security.txt,
  /.well-known/agent-card.json, /.well-known/agent.json, /.well-known/openid-configuration,
  /.well-known/oauth-authorization-server, /.well-known/api-catalog, /.well-known/ai-plugin.json,
  /llms.txt, /openapi.json and /swagger.json. Those 200s are catch-all false positives,
  not published documents: the body is text/html, byte-identical to the shell returned for
  a deliberately nonexistent control path (/nonexistent-page-xyz123, 9,646 bytes), and none
  parses as JSON or as RFC 9116 text. They are recorded below with valid: false so a later
  round does not re-discover them as hits. The only real, non-shell documents served on any
  KreditBee host are /robots.txt and /sitemap.xml on www.kreditbee.in. api.kreditbee.in is
  an AWS API Gateway behind Cloudflare that answers 403 ForbiddenException to every
  anonymous request, including every /.well-known/* path.
