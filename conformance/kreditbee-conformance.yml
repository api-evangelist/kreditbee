note: >-
  Conformance is asserted only where a fetched document proves it. KreditBee publishes no
  OpenAPI, no AsyncAPI, no GraphQL surface, no developer portal, no API reference, no SDKs
  and no /.well-known document, so nearly every cross-cutting standard below is recorded as
  not-evidenced rather than as a failure. KreditBee is a regulated Indian lender and is
  subject to RBI Digital Lending Guidelines and the DPDP Act as a matter of law; that is a
  legal obligation, not a published certification, so no compliance claim is recorded here
  and no `Compliance` pointer is emitted. No SOC 2, ISO 27001, PCI DSS or equivalent
  attestation was found on any public KreditBee page.
